[versions]

[libraries]

# Regular Libraries
detekt-rules-libraries = { group = "io.gitlab.arturbosch.detekt", name = "detekt-rules-libraries", version ="1.23.8" }

# Kotlinx
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.11.0" }

# SLF4J
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.18"}
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version = "2.0.18"}

# Lets-Plot
letsplot-kotlinjvm = { group = "org.jetbrains.lets-plot", name = "lets-plot-kotlin-jvm", version = "4.15.0" }
letsplot-imageexport = { group = "org.jetbrains.lets-plot", name = "lets-plot-image-export", version = "4.8.2" }

# Tests
kotlin-test = { group = "org.jetbrains.kotlin", name="kotlin-test" }

# Gradle Plugins
gradle-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version = "2.4.10" }
gradle-dokka = { group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version = "2.2.0" }
gradle-detekt = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version = "1.23.8" }
gradle-bmVersions = { group = "com.github.ben-manes", name = "gradle-versions-plugin", version = "0.53.0" }
gradle-gitVersioning = { group = "me.qoomon", name = "gradle-git-versioning-plugin", version = "6.4.4" }
gradle-taskTree = { group = "com.dorongold.plugins", name = "task-tree", version = "4.0.2" }
gradle-spotless = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version = "8.10.0" }
gradle-mavenPublish = { group = "com.vanniktech.maven.publish", name = "com.vanniktech.maven.publish.gradle.plugin", version = "0.37.0" }

# JUnit
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version = "6.1.3" }

[bundles]
gradle-kotlin-full = ["gradle-dokka", "gradle-kotlin"]
